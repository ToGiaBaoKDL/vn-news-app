version: 1
owner: vn-news-app
platforms:
  - linux/amd64
  - linux/arm64

change_paths:
  - .dockerignore
  - images.yaml

images:
  app_api:
    image_repository: vn-news-api
    change_paths:
      - api/**
      - pyproject.toml
      - uv.lock
    build:
      context: vn-news-app
      dockerfile: api/Dockerfile
      additional_contexts:
        vn-news-platform-lib: vn-news-platform-lib

  app_web:
    image_repository: vn-news-web
    change_paths:
      - web/**
    build:
      context: vn-news-app
      dockerfile: web/Dockerfile
