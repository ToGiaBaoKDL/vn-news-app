name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out app
        uses: actions/checkout@v6
        with:
          path: vn-news-app

      - name: Check out platform library
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/vn-news-platform-lib
          token: ${{ secrets.WORKSPACE_READ_TOKEN || github.token }}
          path: vn-news-platform-lib

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12"
          working-directory: vn-news-app

      - name: Verify Python
        working-directory: vn-news-app
        run: |
          uv sync --frozen --all-groups
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: vn-news-app
          file: vn-news-app/api/Dockerfile
          build-contexts: |
            vn-news-platform-lib=vn-news-platform-lib
          push: false
          tags: local/vn-news-api:ci
          cache-from: type=gha,scope=vn-news-api
          cache-to: type=gha,mode=max,scope=vn-news-api

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out app
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify web
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: local/vn-news-web:ci
          cache-from: type=gha,scope=vn-news-web
          cache-to: type=gha,mode=max,scope=vn-news-web
