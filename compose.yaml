name: vn-news-app

services:
  api:
    image: ${VN_NEWS_IMAGE_REGISTRY:?set VN_NEWS_IMAGE_REGISTRY}/${VN_NEWS_IMAGE_NAMESPACE:?set VN_NEWS_IMAGE_NAMESPACE}/vn-news-api:${VN_NEWS_IMAGE_TAG:?set VN_NEWS_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${VN_NEWS_APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      VN_NEWS_CONFIG_DIR: /app/configs
    volumes:
      - ${VN_NEWS_CONFIG_HOST_DIR:?set VN_NEWS_CONFIG_HOST_DIR}:/app/configs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${VN_NEWS_IMAGE_REGISTRY:?set VN_NEWS_IMAGE_REGISTRY}/${VN_NEWS_IMAGE_NAMESPACE:?set VN_NEWS_IMAGE_NAMESPACE}/vn-news-web:${VN_NEWS_IMAGE_TAG:?set VN_NEWS_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${VN_NEWS_APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    environment:
      VN_NEWS_API_BASE_URL: ${VN_NEWS_API_BASE_URL:-http://api:8000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
