name: vn-news-app

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      additional_contexts:
        vn-news-platform-lib: ../vn-news-platform-lib
    ports:
      - "8000:8000"
    environment:
      TGB_ENV: local
      VN_NEWS_CONFIG_DIR: /app/configs
    volumes:
      - ../vn-news-config/configs:/app/configs:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./web:/app
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
